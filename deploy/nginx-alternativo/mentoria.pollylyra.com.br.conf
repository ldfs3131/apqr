# ALTERNATIVA ao Caddy: usar só se o Nginx do servidor já atende outro sistema e você não quiser migrá-lo agora.
# Instalação: copie para /etc/nginx/sites-available/, crie o link em sites-enabled, teste com "nginx -t",
# recarregue ("systemctl reload nginx") e emita o certificado com:  certbot --nginx -d mentoria.pollylyra.com.br
server {
    listen 80;
    listen [::]:80;
    server_name mentoria.pollylyra.com.br;

    client_max_body_size 25m;   # envio de PDFs (o padrão do Nginx é 1 MB)

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
